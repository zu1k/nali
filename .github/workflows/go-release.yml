name: Go Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-binary:
    name: Release Binary
    runs-on: ubuntu-latest
    environment: s3
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build
        env:
          NAME: nali
          BINDIR: bin
        # deb packages are built from the plain binaries before `releases` compresses them
        run: make -j"$(nproc)" deb && make -j"$(nproc)" releases && make sha256sum

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: bin/*
          draft: true
          prerelease: true
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: bin

      - name: Upload to s3
        run: sh .github/scripts/upload_s3.sh
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}

  release-aur-bin:
    name: Release Aur bin
    needs: [release-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF##*/v}" >> "$GITHUB_OUTPUT"

      - name: Publish AUR package nali-go-bin
        uses: zu1k/aur-publish-action@master
        with:
          package_name: nali-go-bin
          commit_username: 'zu1k'
          commit_email: 'i@zu1k.com'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          new_release: ${{ steps.version.outputs.version }}

  release-aur:
    name: Release Aur
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF##*/v}" >> "$GITHUB_OUTPUT"

      - name: Publish AUR package nali-go
        uses: zu1k/aur-publish-action@master
        with:
          package_name: nali-go
          commit_username: 'zu1k'
          commit_email: 'i@zu1k.com'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          new_release: ${{ steps.version.outputs.version }}
